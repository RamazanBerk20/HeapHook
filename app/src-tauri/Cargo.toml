[package]
name = "heaphook"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
hh-core.workspace = true
hh-scan.workspace = true
hh-asm.workspace = true
hh-debug.workspace = true
hh-ptr.workspace = true
hh-lua.workspace = true
hh-tools.workspace = true
hh-inject.workspace = true
hh-net.workspace = true
# Same version and features as hh-lua (already in the tree): host code reads Lua globals.
mlua = { version = "0.12", features = ["lua53", "vendored", "send"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "intel", "op_code_info"] }
serde.workspace = true
serde_json = "1"
tempfile = "3.10"
roxmltree = "0.21"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(unix)'.dependencies]
# waitpid for processes started under the debugger (they have no std `Child`).
libc = "0.2"

[features]
# Development only: `heaphook --dev-bridge <port>` serves app/ui and the IPC commands over
# HTTP on 127.0.0.1 (see src/bridge.rs). Never enabled for release bundles.
dev-bridge = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
