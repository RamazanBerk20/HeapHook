[package]
name = "hh-speedhack"
version = "1.0.0-rc.2"
license = "Apache-2.0"
edition = "2024"
description = "HeapHook speedhack payload, injected into the target process"

# Its own workspace root: this cdylib is built separately from the HeapHook workspace
# (cargo build --release --manifest-path crates/hh-inject/payload/Cargo.toml).
[workspace]

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
