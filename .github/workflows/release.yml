name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev build-essential patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build speedhack payload
        if: runner.os == 'Linux'
        run: cargo build --release --manifest-path crates/hh-inject/payload/Cargo.toml
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build bundles
        working-directory: app/src-tauri
        run: cargo tauri build
      - name: Build hh-server
        run: cargo build --release -p hh-net --bin hh-server
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: heaphook-bundles-${{ runner.os }}
          path: target/release/bundle/**
          if-no-files-found: error
      - name: Upload hh-server
        uses: actions/upload-artifact@v4
        with:
          name: hh-server-${{ runner.os }}
          path: |
            target/release/hh-server
            target/release/hh-server.exe
          if-no-files-found: error
