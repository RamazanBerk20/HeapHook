name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" $flags --title "HeapHook ${TAG#v}" --notes-file docs/RELEASE_NOTES.md

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev build-essential patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build speedhack payload
        if: runner.os == 'Linux'
        run: cargo build --release --manifest-path crates/hh-inject/payload/Cargo.toml
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build bundles
        working-directory: app/src-tauri
        run: cargo tauri build
      - name: Build hh-server
        run: cargo build --release -p hh-net --bin hh-server
      - name: Collect and upload release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          mkdir out
          if [ "$RUNNER_OS" = Linux ]; then
            cp target/release/bundle/deb/*.deb "out/heaphook-$v-linux-x86_64.deb"
            cp target/release/bundle/rpm/*.rpm "out/heaphook-$v-linux-x86_64.rpm"
            cp target/release/bundle/appimage/*.AppImage "out/heaphook-$v-linux-x86_64.AppImage"
            cp target/release/hh-server "out/hh-server-$v-linux-x86_64"
            # Portable layout: the app looks for the speedhack library next to the executable.
            mkdir "heaphook-$v-linux-x86_64"
            cp target/release/heaphook crates/hh-inject/payload/target/release/libhh_speedhack.so \
              LICENSE README.md "heaphook-$v-linux-x86_64/"
            tar czf "out/heaphook-$v-linux-x86_64.tar.gz" "heaphook-$v-linux-x86_64"
          else
            cp target/release/bundle/nsis/*.exe "out/heaphook-$v-windows-x86_64-setup.exe"
            cp target/release/heaphook.exe "out/heaphook-$v-windows-x86_64.exe"
            cp target/release/hh-server.exe "out/hh-server-$v-windows-x86_64.exe"
          fi
          (cd out && sha256sum * > "SHA256SUMS-$RUNNER_OS.txt")
          gh release upload "$TAG" out/* --clobber
